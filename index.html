<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseCare Enterprise HMIS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        medical: {
                            teal: '#0d9488',
                            emerald: '#059669',
                            rose: '#e11d48',
                            amber: '#d97706',
                            indigo: '#4f46e5'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom scrollbar for dense data panels */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Print styles for invoices and reports */
        @media print {
            body * {
                visibility: hidden;
            }
            #printable-area, #printable-area * {
                visibility: visible;
            }
            #printable-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .no-print {
                display: none !important;
            }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="h-full text-slate-800 font-sans antialiased overflow-hidden flex flex-col bg-slate-100 dark:bg-slate-900 dark:text-slate-100">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <!-- Main Wrapper -->
    <div class="flex h-screen overflow-hidden">

        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="w-64 bg-slate-900 text-slate-300 flex flex-col flex-shrink-0 transition-all duration-300 z-20">
            <!-- App Brand Header -->
            <div class="h-16 flex items-center justify-between px-4 bg-slate-950 border-b border-slate-800">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-teal-400 flex items-center justify-center text-white shadow-lg shadow-sky-500/30">
                        <i class="fa-solid font-bold fa-heart-pulse text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-white text-base tracking-wide leading-none">PulseCare</h1>
                        <span class="text-[10px] text-sky-400 font-medium tracking-wider uppercase">Enterprise HMIS</span>
                    </div>
                </div>
                <button id="toggle-sidebar" class="text-slate-400 hover:text-white md:hidden">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Navigation Links -->
            <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
                <a href="#dashboard" class="nav-link active flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all text-white bg-sky-600/20 text-sky-400 border-l-4 border-sky-500">
                    <i class="fa-solid fa-chart-line w-5 text-center"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#patients" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition-all">
                    <i class="fa-solid fa-user-injured w-5 text-center"></i>
                    <span>Patients & EHR</span>
                </a>
                <a href="#appointments" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition-all">
                    <i class="fa-solid fa-calendar-check w-5 text-center"></i>
                    <span>Appointments</span>
                </a>
                <a href="#clinical" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition-all">
                    <i class="fa-solid fa-stethoscope w-5 text-center"></i>
                    <span>Doctor Portal</span>
                </a>
                <a href="#pharmacy" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition-all">
                    <i class="fa-solid fa-pills w-5 text-center"></i>
                    <span>Pharmacy & Stock</span>
                </a>
                <a href="#laboratory" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition-all">
                    <i class="fa-solid fa-vials w-5 text-center"></i>
                    <span>Lab Diagnostics</span>
                </a>
                <a href="#ipd" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition-all">
                    <i class="fa-solid fa-bed w-5 text-center"></i>
                    <span>Inpatient & Wards</span>
                </a>
                <a href="#billing" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition-all">
                    <i class="fa-solid fa-file-invoice-dollar w-5 text-center"></i>
                    <span>Billing & Claims</span>
                </a>
                <a href="#reports" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition-all">
                    <i class="fa-solid fa-chart-pie w-5 text-center"></i>
                    <span>Analytics & Reports</span>
                </a>
            </nav>

            <!-- Sidebar Footer Status -->
            <div class="p-3 border-t border-slate-800 bg-slate-950/50">
                <div class="flex items-center gap-3 px-2 py-1.5">
                    <div class="relative">
                        <img src="https://images.unsplash.com/photo-1622253692010-333f2da6031d?w=100&auto=format&fit=crop&q=80" class="w-9 h-9 rounded-full object-cover border border-slate-700" alt="Doctor Profile">
                        <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 rounded-full border-2 border-slate-900"></span>
                    </div>
                    <div class="overflow-hidden">
                        <p class="text-xs font-semibold text-slate-200 truncate">Dr. Sarah Jenkins</p>
                        <p class="text-[10px] text-slate-400 truncate">Chief Medical Officer</p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Body Content Area -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-50 dark:bg-slate-900">
            
            <!-- Top Navigation / Header -->
            <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-6 z-10">
                <div class="flex items-center gap-4">
                    <button id="mobile-menu-btn" class="text-slate-600 dark:text-slate-300 md:hidden hover:text-slate-900">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                    <!-- Global Search -->
                    <div class="relative w-64 md:w-80">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" id="global-search" placeholder="Search patients, doctors, drugs..." 
                            class="w-full pl-9 pr-4 py-1.5 bg-slate-100 dark:bg-slate-700/50 border border-transparent dark:border-slate-600 rounded-xl text-sm focus:outline-none focus:bg-white dark:focus:bg-slate-800 focus:border-sky-500 transition-all">
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <!-- Quick System Time / Date Badge -->
                    <div class="hidden lg:flex flex-col text-right pr-2 border-r border-slate-200 dark:border-slate-700">
                        <span id="current-date" class="text-xs font-semibold text-slate-700 dark:text-slate-200"></span>
                        <span id="current-time" class="text-[11px] text-slate-400"></span>
                    </div>

                    <!-- Theme Toggle Button -->
                    <button id="theme-toggle" class="p-2 text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-colors">
                        <i class="fa-solid fa-moon text-lg dark:hidden"></i>
                        <i class="fa-solid fa-sun text-lg hidden dark:block text-amber-400"></i>
                    </button>

                    <!-- Notifications Button -->
                    <div class="relative">
                        <button id="notif-btn" class="p-2 text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition-colors relative">
                            <i class="fa-solid fa-bell text-lg"></i>
                            <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 rounded-full"></span>
                        </button>
                    </div>

                    <div class="h-6 w-px bg-slate-200 dark:bg-slate-700 mx-1"></div>

                    <!-- Action: Quick Register Patient -->
                    <button onclick="openModal('patient-modal')" class="hidden sm:flex items-center gap-2 bg-sky-600 hover:bg-sky-700 text-white text-xs font-semibold px-3.5 py-2 rounded-xl shadow-sm shadow-sky-500/20 transition-all">
                        <i class="fa-solid fa-plus"></i>
                        <span>New Patient</span>
                    </button>
                </div>
            </header>

            <!-- Main View Container (Dynamic Content Loaded Here) -->
            <main id="main-content" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                <!-- Modules dynamically switch here via JavaScript -->
            </main>
        </div>
    </div>

    <!-- GLOBAL MODALS CONTAINER -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 hidden transition-opacity"></div>

    <!-- 1. PATIENT REGISTRATION / EDIT MODAL -->
    <div id="patient-modal" class="modal-dialog fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-100 dark:border-slate-700 w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden transform transition-all">
            <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800">
                <h3 class="font-bold text-slate-800 dark:text-slate-100 text-lg flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-sky-500"></i>
                    <span id="patient-modal-title">Register New Patient</span>
                </h3>
                <button onclick="closeModal('patient-modal')" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="patient-form" class="p-6 overflow-y-auto space-y-4 flex-1">
                <input type="hidden" id="patient-id">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Full Name *</label>
                        <input type="text" id="patient-name" required class="w-full px-3 py-2 border rounded-xl text-sm dark:bg-slate-700 dark:border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Age / DOB *</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" id="patient-age" placeholder="Age" required class="w-full px-3 py-2 border rounded-xl text-sm dark:bg-slate-700 dark:border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none">
                            <select id="patient-gender" required class="w-full px-3 py-2 border rounded-xl text-sm dark:bg-slate-700 dark:border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Phone Number *</label>
                        <input type="tel" id="patient-phone" required class="w-full px-3 py-2 border rounded-xl text-sm dark:bg-slate-700 dark:border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Email Address</label>
                        <input type="email" id="patient-email" class="w-full px-3 py-2 border rounded-xl text-sm dark:bg-slate-700 dark:border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Blood Type</label>
                        <select id="patient-blood" class="w-full px-3 py-2 border rounded-xl text-sm dark:bg-slate-700 dark:border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none">
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Insurance Provider</label>
                        <input type="text" id="patient-insurance" placeholder="e.g. Aetna, BlueCross, Self-Pay" class="w-full px-3 py-2 border rounded-xl text-sm dark:bg-slate-700 dark:border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Residential Address</label>
                    <input type="text" id="patient-address" class="w-full px-3 py-2 border rounded-xl text-sm dark:bg-slate-700 dark:border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Known Allergies</label>
                        <input type="text" id="patient-allergies" placeholder="e.g., Penicillin, Peanuts" class="w-full px-3 py-2 border rounded-xl text-sm dark:bg-slate-700 dark:border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Emergency Contact</label>
                        <input type="text" id="patient-emergency" placeholder="Name & Phone" class="w-full px-3 py-2 border rounded-xl text-sm dark:bg-slate-700 dark:border-slate-600 focus:ring-2 focus:ring-sky-500 outline-none">
                    </div>
                </div>
                <div class="pt-4 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-3">
                    <button type="button" onclick="closeModal('patient-modal')" class="px-4 py-2 border text-slate-600 dark:text-slate-300 rounded-xl text-sm hover:bg-slate-100 dark:hover:bg-slate-700">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-sky-600 text-white rounded-xl text-sm font-semibold hover:bg-sky-700 shadow-sm">Save Patient</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. APPOINTMENT MODAL -->
    <div id="appointment-modal" class="modal-dialog fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-100 dark:border-slate-700 w-full max-w-md overflow-hidden transform transition-all">
            <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800">
                <h3 class="font-bold text-slate-800 dark:text-slate-100 text-lg flex items-center gap-2">
                    <i class="fa-solid fa-calendar-plus text-emerald-500"></i>
                    <span>Schedule Appointment</span>
                </h3>
                <button onclick="closeModal('appointment-modal')" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="appointment-form" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Select Patient *</label>
                    <select id="app-patient" required class="w-full px-3 py-2 border rounded-xl text-sm dark:bg-slate-700 dark:border-slate-600 focus:ring-2 focus:ring-emerald-500 outline-none"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Select Doctor *</label>
                    <select id="app-doctor" required class="w-full px-3 py-2 border rounded-xl text-sm dark:bg-slate-700 dark:border-slate-600 focus:ring-2 focus:ring-emerald-500 outline-none"></select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Date *</label>
                        <input type="date" id="app-date" required class="w-full px-3 py-2 border rounded-xl text-sm dark:bg-slate-700 dark:border-slate-600 focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Time Slot *</label>
                        <input type="time" id="app-time" required class="w-full px-3 py-2 border rounded-xl text-sm dark:bg-slate-700 dark:border-slate-600 focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Reason for Visit</label>
                    <textarea id="app-reason" rows="2" class="w-full px-3 py-2 border rounded-xl text-sm dark:bg-slate-700 dark:border-slate-600 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="Symptoms, routine checkup, follow-up..."></textarea>
                </div>
                <div class="pt-4 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-3">
                    <button type="button" onclick="closeModal('appointment-modal')" class="px-4 py-2 border text-slate-600 dark:text-slate-300 rounded-xl text-sm">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-emerald-600 text-white rounded-xl text-sm font-semibold hover:bg-emerald-700 shadow-sm">Confirm Booking</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 3. PRINTABLE INVOICE / REPORT MODAL -->
    <div id="print-modal" class="modal-dialog fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-3xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="px-6 py-3 bg-slate-800 text-white flex justify-between items-center no-print">
                <span class="text-sm font-semibold">Document Preview</span>
                <div class="flex gap-2">
                    <button onclick="window.print()" class="px-3 py-1 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-xs flex items-center gap-1.5 font-medium">
                        <i class="fa-solid fa-print"></i> Print Document
                    </button>
                    <button onclick="closeModal('print-modal')" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs">Close</button>
                </div>
            </div>
            <div id="printable-area" class="p-8 overflow-y-auto flex-1 text-slate-800 bg-white">
                <!-- Dynamically generated invoice or lab report content -->
            </div>
        </div>
    </div>

    <!-- MAIN SYSTEM APPLICATION LOGIC -->
    <script>

                    document.getElementById('current-time').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                updateTime();
                setInterval(updateTime, 1000);

                document.getElementById('global-search').addEventListener('input', (e) => {

                    info: 'bg-sky-600 text-white',
                    warning: 'bg-amber-500 text-white'

                toast.className = `p-4 rounded-xl shadow-lg ${colors[type] || colors.info} flex items-center justify-between pointer-events-auto transform transition-all duration-300 translate-y-2 opacity-0`;
                toast.innerHTML = `

                        <span>${message}</span>
                    </div>
                    <button onclick="this.parentElement.remove()" class="text-white/80 hover:text-white ml-4"><i class="fa-solid fa-xmark"></i></button>
                `;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.classList.remove('translate-y-2', 'opacity-0');

                const price = parseFloat(prompt("Enter Unit Price ($):", "10.00"));

                const newDrug = {
                    id: `DRG-${Math.floor(10 + Math.random() * 90)}`,
                    name,
                    category: category || 'General',
                    stock: stock || 100,
                    unitPrice: price || 10.0,
                    batch: `B${Math.floor(1000 + Math.random() * 9000)}`,
                    expiry: '2028-12-31'
                };

                this.db.inventory.push(newDrug);
                this.saveDB();
                this.notify(`${name} added to pharmacy inventory!`, 'success');
                this.renderPharmacy(document.getElementById('main-content'));
            }

            restockDrug(id) {
                const item = this.db.inventory.find(i => i.id === id);
                if (item) {
                    const qty = parseInt(prompt(`Restock quantity for ${item.name}:`, "50"));
                    if (qty && !isNaN(qty)) {
                        item.stock += qty;
                        this.saveDB();
                        this.notify(`Added ${qty} units to ${item.name}`, 'success');
                        this.renderPharmacy(document.getElementById('main-content'));
                    }
                }
            }

            /* =========================================================================
               6. LABORATORY & DIAGNOSTICS MODULE
               ========================================================================= */
            renderLaboratory(container) {
                container.innerHTML = `
                    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 p-5 shadow-sm">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                            <div>
                                <h3 class="font-bold text-slate-800 dark:text-slate-100 text-lg">Laboratory Diagnostic Orders & Reports</h3>
                                <p class="text-xs text-slate-400">Order lab work, post findings, and print diagnostic certificates</p>
                            </div>
                            <button onclick="app.openOrderLabModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-sm flex items-center gap-2">
                                <i class="fa-solid fa-plus"></i> Order Lab Test
                            </button>
                        </div>

                        <!-- Lab Orders List -->
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-slate-200 dark:border-slate-700 text-[11px] font-semibold text-slate-400 uppercase tracking-wider bg-slate-50/50 dark:bg-slate-800">
                                        <th class="py-3 px-4">Order ID</th>
                                        <th class="py-3 px-4">Patient</th>
                                        <th class="py-3 px-4">Test Name</th>
                                        <th class="py-3 px-4">Ordering Doctor</th>
                                        <th class="py-3 px-4">Date</th>
                                        <th class="py-3 px-4">Status</th>
                                        <th class="py-3 px-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 dark:divide-slate-700 text-xs">
                                    ${this.db.labTests.map(lab => `
                                        <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-700/30">
                                            <td class="py-3 px-4 font-mono font-bold text-slate-500">${lab.id}</td>
                                            <td class="py-3 px-4 font-semibold text-slate-800 dark:text-slate-200">${lab.patientName}</td>
                                            <td class="py-3 px-4 text-indigo-600 dark:text-indigo-400 font-medium">${lab.testName}</td>
                                            <td class="py-3 px-4 text-slate-600 dark:text-slate-300">${lab.doctor}</td>
                                            <td class="py-3 px-4 text-slate-500">${lab.date}</td>
                                            <td class="py-3 px-4">
                                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                                    lab.status === 'Completed' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'
                                                }">${lab.status}</span>
                                            </td>
                                            <td class="py-3 px-4 text-right space-x-2">
                                                ${lab.status === 'Pending' ? `
                                                    <button onclick="app.updateLabResult('${lab.id}')" title="Enter Findings" class="p-1.5 text-indigo-600 hover:bg-indigo-50 rounded-lg"><i class="fa-solid fa-square-plus"></i> Result</button>
                                                ` : `
                                                    <button onclick="app.printLabReport('${lab.id}')" title="Print Lab Certificate" class="p-1.5 text-sky-600 hover:bg-sky-50 rounded-lg"><i class="fa-solid fa-print"></i> Print</button>
                                                `}
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            openOrderLabModal() {
                const patientId = prompt("Enter Patient MRN (e.g. PAT-1001):", "PAT-1001");
                const p = this.db.patients.find(item => item.id === patientId);
                if (!p) {
                    alert("Patient MRN not found!");
                    return;
                }
                const testName = prompt("Enter Test Name (e.g., Complete Blood Count, Liver Function Test):");
                if (!testName) return;

                const newLab = {
                    id: `LAB-${Math.floor(900 + Math.random() * 100)}`,
                    patientId: p.id,
                    patientName: p.name,
                    testName,
                    doctor: 'Dr. Sarah Jenkins',
                    date: new Date().toISOString().split('T')[0],
                    status: 'Pending',
                    result: 'Awaiting lab findings'
                };

                this.db.labTests.unshift(newLab);
                this.saveDB();
                this.notify(`Lab test ordered for ${p.name}`, 'success');
                this.renderLaboratory(document.getElementById('main-content'));
            }

            updateLabResult(id) {
                const lab = this.db.labTests.find(l => l.id === id);
                if (lab) {
                    const res = prompt(`Enter diagnostic findings/results for ${lab.testName}:`);
                    if (res) {
                        lab.result = res;
                        lab.status = 'Completed';
                        this.saveDB();
                        this.notify('Lab report updated successfully!', 'success');
                        this.renderLaboratory(document.getElementById('main-content'));
                    }
                }
            }

            printLabReport(id) {
                const lab = this.db.labTests.find(l => l.id === id);
                if (!lab) return;

                const area = document.getElementById('printable-area');
                area.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex justify-between items-center border-b pb-4">
                            <div>
                                <h2 class="text-xl font-bold text-slate-900">PulseCare Diagnostics Lab</h2>
                                <p class="text-xs text-slate-500">ISO 9001:2026 Certified Laboratory Services</p>
                            </div>
                            <div class="text-right">
                                <p class="text-xs font-bold text-slate-700">Lab Order Ref: ${lab.id}</p>
                                <p class="text-xs text-slate-500">Date: ${lab.date}</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 text-xs bg-slate-50 p-4 rounded-xl border">
                            <div>
                                <p><strong>Patient Name:</strong> ${lab.patientName}</p>
                                <p><strong>Patient ID:</strong> ${lab.patientId}</p>
                            </div>
                            <div>
                                <p><strong>Ordering Physician:</strong> ${lab.doctor}</p>
                                <p><strong>Test Type:</strong> ${lab.testName}</p>
                            </div>
                        </div>

                        <div class="mt-6">
                            <h4 class="font-bold text-sm text-slate-800 mb-2 border-b pb-1">Diagnostic Findings & Results</h4>
                            <div class="p-4 bg-white border rounded-xl font-mono text-xs text-slate-800 leading-relaxed whitespace-pre-wrap">
                                ${lab.result}
                            </div>
                        </div>

                        <div class="pt-12 flex justify-between text-xs text-slate-500">
                            <div>
                                <p class="border-t pt-1 border-slate-300 w-40 text-center">Pathologist Signature</p>
                            </div>
                            <div>
                                <p class="border-t pt-1 border-slate-300 w-40 text-center">Authorized Stamp</p>
                            </div>
                        </div>
                    </div>
                `;
                openModal('print-modal');
            }

            /* =========================================================================
               7. INPATIENT & WARD MANAGEMENT (IPD)
               ========================================================================= */
            renderInpatient(container) {
                container.innerHTML = `
                    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 p-5 shadow-sm">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                            <div>
                                <h3 class="font-bold text-slate-800 dark:text-slate-100 text-lg">Inpatient Wards & Bed Occupancy Grid</h3>
                                <p class="text-xs text-slate-400">Manage ward allocations, ICU units, and patient admissions</p>
                            </div>
                        </div>

                        <!-- Ward Bed Map Cards -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${this.db.beds.map(bed => `
                                <div class="p-4 rounded-2xl border ${
                                    bed.status === 'Occupied' ? 'bg-rose-50/50 border-rose-200 dark:bg-rose-950/20 dark:border-rose-900/50' :
                                    bed.status === 'Cleaning' ? 'bg-amber-50/50 border-amber-200 dark:bg-amber-950/20 dark:border-amber-900/50' :
                                    'bg-emerald-50/50 border-emerald-200 dark:bg-emerald-950/20 dark:border-emerald-900/50'
                                } flex flex-col justify-between">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <span class="text-[10px] font-bold uppercase text-slate-400 tracking-wider">${bed.ward}</span>
                                            <h4 class="font-bold text-slate-800 dark:text-slate-100 text-sm">${bed.room}</h4>
                                        </div>
                                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                            bed.status === 'Occupied' ? 'bg-rose-100 text-rose-700' :
                                            bed.status === 'Cleaning' ? 'bg-amber-100 text-amber-700' :
                                            'bg-emerald-100 text-emerald-700'
                                        }">${bed.status}</span>
                                    </div>

                                    <div class="my-4 text-xs">
                                        ${bed.status === 'Occupied' ? `
                                            <p class="font-semibold text-slate-700 dark:text-slate-200"><i class="fa-solid fa-user-check mr-1 text-sky-500"></i> ${bed.patientName}</p>
                                            <p class="text-[11px] text-slate-400 mt-0.5">Admitted: ${bed.admittedOn}</p>
                                        ` : `
                                            <p class="text-slate-400 italic">Ready for allocation</p>
                                        `}
                                    </div>

                                    <div class="pt-2 border-t border-slate-200/60 dark:border-slate-700 flex justify-end">
                                        ${bed.status === 'Occupied' ? `
                                            <button onclick="app.dischargePatient('${bed.id}')" class="text-xs px-3 py-1 bg-rose-600 text-white rounded-lg hover:bg-rose-700 font-medium">Discharge</button>
                                        ` : `
                                            <button onclick="app.allocateBed('${bed.id}')" class="text-xs px-3 py-1 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700 font-medium">Allocate Patient</button>
                                        `}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            allocateBed(bedId) {
                const bed = this.db.beds.find(b => b.id === bedId);
                if (!bed) return;
                const patientId = prompt("Enter Patient MRN to allocate (e.g. PAT-1002):");
                const patient = this.db.patients.find(p => p.id === patientId);
                if (!patient) {
                    alert("Patient not found!");
                    return;
                }

                bed.status = 'Occupied';
                bed.patientId = patient.id;
                bed.patientName = patient.name;
                bed.admittedOn = new Date().toISOString().split('T')[0];

                this.saveDB();
                this.notify(`${patient.name} admitted to ${bed.room}`, 'success');
                this.renderInpatient(document.getElementById('main-content'));
            }

            dischargePatient(bedId) {
                const bed = this.db.beds.find(b => b.id === bedId);
                if (bed && confirm(`Discharge patient ${bed.patientName} from ${bed.room}?`)) {
                    this.notify(`Discharged ${bed.patientName}. Bed moved to cleaning queue.`);
                    bed.status = 'Vacant';
                    bed.patientId = null;
                    bed.patientName = null;
                    bed.admittedOn = null;
                    this.saveDB();
                    this.renderInpatient(document.getElementById('main-content'));
                }
            }

            /* =========================================================================
               8. BILLING, INVOICING & CLAIMS MODULE
               ========================================================================= */
            renderBilling(container) {
                container.innerHTML = `
                    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 p-5 shadow-sm">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                            <div>
                                <h3 class="font-bold text-slate-800 dark:text-slate-100 text-lg">Billing Ledger & Insurance Claims</h3>
                                <p class="text-xs text-slate-400">Generate medical invoices, process payments and manage claims</p>
                            </div>
                            <button onclick="app.openInvoiceModal()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-sm flex items-center gap-2">
                                <i class="fa-solid fa-plus"></i> Create New Invoice
                            </button>
                        </div>

                        <!-- Invoices List -->
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="border-b border-slate-200 dark:border-slate-700 text-[11px] font-semibold text-slate-400 uppercase tracking-wider bg-slate-50/50 dark:bg-slate-800">
                                        <th class="py-3 px-4">Invoice #</th>
                                        <th class="py-3 px-4">Patient Name</th>
                                        <th class="py-3 px-4">Date</th>
                                        <th class="py-3 px-4">Payment Method</th>
                                        <th class="py-3 px-4">Total Amount</th>
                                        <th class="py-3 px-4">Status</th>
                                        <th class="py-3 px-4 text-right">Actions</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 dark:divide-slate-700 text-xs">
                                    ${this.db.invoices.map(inv => `
                                        <tr class="hover:bg-slate-50/50 dark:hover:bg-slate-700/30">
                                            <td class="py-3 px-4 font-mono font-bold text-slate-500">${inv.id}</td>
                                            <td class="py-3 px-4 font-semibold text-slate-800 dark:text-slate-200">${inv.patientName}</td>
                                            <td class="py-3 px-4 text-slate-500">${inv.date}</td>
                                            <td class="py-3 px-4 text-slate-600 dark:text-slate-300">${inv.method}</td>
                                            <td class="py-3 px-4 font-bold text-slate-800 dark:text-slate-100">$${inv.total.toFixed(2)}</td>
                                            <td class="py-3 px-4">
                                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                                    inv.status === 'Paid' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'
                                                }">${inv.status}</span>
                                            </td>
                                            <td class="py-3 px-4 text-right space-x-2">
                                                ${inv.status === 'Unpaid' ? `
                                                    <button onclick="app.payInvoice('${inv.id}')" title="Mark as Paid" class="p-1.5 text-emerald-600 hover:bg-emerald-50 rounded-lg"><i class="fa-solid fa-dollar-sign"></i> Pay</button>
                                                ` : ''}
                                                <button onclick="app.printInvoice('${inv.id}')" title="Print Receipt" class="p-1.5 text-sky-600 hover:bg-sky-50 rounded-lg"><i class="fa-solid fa-print"></i></button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            openInvoiceModal() {
                const patientId = prompt("Enter Patient MRN (e.g. PAT-1001):", "PAT-1001");
                const p = this.db.patients.find(item => item.id === patientId);
                if (!p) {
                    alert("Patient MRN invalid!");
                    return;
                }

                const desc = prompt("Enter Service Description (e.g. General Consultation + Meds):", "Hospital Care Consultation");
                const amount = parseFloat(prompt("Enter Total Amount ($):", "150.00"));

                if (!desc || isNaN(amount)) return;

                const newInv = {
                    id: `INV-${Math.floor(8800 + Math.random() * 100)}`,
                    patientId: p.id,
                    patientName: p.name,
                    date: new Date().toISOString().split('T')[0],
                    items: [{ desc, cost: amount }],
                    total: amount,
                    status: 'Unpaid',
                    method: p.insurance ? `Insurance (${p.insurance})` : 'Cash'
                };

                this.db.invoices.unshift(newInv);
                this.saveDB();
                this.notify(`Invoice ${newInv.id} created successfully!`, 'success');
                this.renderBilling(document.getElementById('main-content'));
            }

            payInvoice(id) {
                const inv = this.db.invoices.find(i => i.id === id);
                if (inv) {
                    inv.status = 'Paid';
                    this.saveDB();
                    this.notify(`Invoice ${id} paid in full!`, 'success');
                    this.renderBilling(document.getElementById('main-content'));
                }
            }

            printInvoice(id) {
                const inv = this.db.invoices.find(i => i.id === id);
                if (!inv) return;

                const area = document.getElementById('printable-area');
                area.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex justify-between items-start border-b pb-4">
                            <div>
                                <h2 class="text-2xl font-bold text-slate-900">PulseCare Medical Center</h2>
                                <p class="text-xs text-slate-500">100 Healthcare Blvd, Medical District, NY</p>
                            </div>
                            <div class="text-right">
                                <h3 class="text-lg font-bold text-slate-700">INVOICE</h3>
                                <p class="text-xs text-slate-500"># ${inv.id}</p>
                                <p class="text-xs text-slate-500">Date: ${inv.date}</p>
                            </div>
                        </div>

                        <div class="text-xs bg-slate-50 p-4 rounded-xl border">
                            <p class="font-bold text-slate-700">Billed To:</p>
                            <p class="text-slate-800">${inv.patientName} (${inv.patientId})</p>
                            <p class="text-slate-500">Payment Mode: ${inv.method}</p>
                        </div>

                        <table class="w-full text-left text-xs border-collapse">
                            <thead>
                                <tr class="border-b bg-slate-100">
                                    <th class="p-2">Description</th>
                                    <th class="p-2 text-right">Amount ($)</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">
                                ${inv.items.map(item => `
                                    <tr>
                                        <td class="p-2">${item.desc}</td>
                                        <td class="p-2 text-right">$${item.cost.toFixed(2)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>

                        <div class="border-t pt-4 flex justify-between items-center text-xs font-bold">
                            <span>Status: <span class="uppercase font-extrabold ${inv.status==='Paid'?'text-emerald-600':'text-rose-600'}">${inv.status}</span></span>
                            <span class="text-base text-slate-900">Total Billed: $${inv.total.toFixed(2)}</span>
                        </div>
                    </div>
                `;
                openModal('print-modal');
            }

            /* =========================================================================
               9. REPORTS & ANALYTICS MODULE
               ========================================================================= */
            renderReports(container) {
                container.innerHTML = `
                    <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 p-5 shadow-sm">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                            <div>
                                <h3 class="font-bold text-slate-800 dark:text-slate-100 text-lg">Hospital Analytics & Export Hub</h3>
                                <p class="text-xs text-slate-400">Export system dataset records and generate executive reports</p>
                            </div>
                            <button onclick="app.exportCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-sm flex items-center gap-2">
                                <i class="fa-solid fa-file-csv"></i> Export Patient Data (CSV)
                            </button>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="p-4 border dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-700/30">
                                <h4 class="font-bold text-xs uppercase text-slate-500 mb-2">System Audit Summary</h4>
                                <ul class="text-xs space-y-2 text-slate-700 dark:text-slate-300">
                                    <li class="flex justify-between"><span>Total Registered Patients:</span> <strong>${this.db.patients.length}</strong></li>
                                    <li class="flex justify-between"><span>Appointments Logged:</span> <strong>${this.db.appointments.length}</strong></li>
                                    <li class="flex justify-between"><span>Pharmacy SKUs Maintained:</span> <strong>${this.db.inventory.length}</strong></li>
                                    <li class="flex justify-between"><span>Inpatient Wards Managed:</span> <strong>${this.db.beds.length}</strong></li>
                                </ul>
                            </div>

                            <div class="p-4 border dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-700/30">
                                <h4 class="font-bold text-xs uppercase text-slate-500 mb-2">Data Operations</h4>
                                <p class="text-xs text-slate-500 mb-3">Reset local data store back to baseline factory state.</p>
                                <button onclick="app.resetSystem()" class="px-3 py-1.5 bg-rose-600 text-white text-xs font-semibold rounded-lg hover:bg-rose-700">
                                    Factory Reset HMIS LocalStorage
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            exportCSV() {
                let csv = 'ID,Name,Age,Gender,Phone,Blood,Insurance\n';
                this.db.patients.forEach(p => {
                    csv += `"${p.id}","${p.name}",${p.age},"${p.gender}","${p.phone}","${p.blood}","${p.insurance}"\n`;
                });

                const blob = new Blob([csv], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `PulseCare_Patients_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                this.notify('Patient records exported to CSV format.', 'success');
            }

            resetSystem() {
                if (confirm("Resetting system will restore original sample state. Continue?")) {
                    localStorage.removeItem(HMIS_STORAGE_KEY);
                    location.reload();
                }
            }

            handleGlobalSearch(query) {
                // Find matching patient or doctor
                const matchPatient = this.db.patients.find(p => p.name.toLowerCase().includes(query));
                if (matchPatient) {
                    window.location.hash = '#patients';
                    this.viewPatientProfile(matchPatient.id);
                }
            }
        }

        // Global Utility Functions for Modal Dialogs
        function openModal(id) {
            document.getElementById('modal-backdrop').classList.remove('hidden');
            document.getElementById(id).classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById('modal-backdrop').classList.add('hidden');
            document.getElementById(id).classList.add('hidden');
        }

        // Initialize HMIS App on Page Load
        let app;
        window.onload = () => {
            app = new HMISApp();
        };
    </script>
</body>
</html>
